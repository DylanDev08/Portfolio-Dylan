name: Browser visual verification

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/browser-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install project
        run: npm ci
      - name: Install pinned Playwright (CI-only)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run real-browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          node scripts/visual-smoke.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-visuals
          path: frontend/visual-artifacts/
          retention-days: 7
